<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mikias Mekuria</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;900&family=Cinzel:wght@700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{
  background:linear-gradient(160deg,#0f0c29,#302b63,#0f3460);
  min-height:100vh;display:flex;justify-content:center;align-items:flex-start;
  font-family:'Montserrat',sans-serif;padding:30px 16px;
}
.card{
  width:100%;max-width:420px;
  background:linear-gradient(160deg,#1a1a2e,#16213e,#0f3460);
  border-radius:28px;
  border:1px solid rgba(212,175,55,0.35);
  box-shadow:0 30px 80px rgba(0,0,0,0.7);
  overflow:hidden;
}
.top-bar{height:6px;background:linear-gradient(to right,#078930,#FCDD09,#DA121A);}

.profile-section{
  display:flex;flex-direction:column;align-items:center;
  padding:36px 24px 24px;
  background:radial-gradient(ellipse at 50% 0%, rgba(212,175,55,0.12) 0%, transparent 70%);
}
.photo-ring{
  width:120px;height:120px;border-radius:50%;
  padding:3px;
  background:linear-gradient(135deg,#D4AF37,#fff8dc,#D4AF37);
  box-shadow:0 0 35px rgba(212,175,55,0.5);
  margin-bottom:16px;
}
.photo-ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:top;border:3px solid #1a1a2e;}

.amharic-name{font-size:12px;letter-spacing:3px;color:#D4AF37;margin-bottom:6px;font-weight:600;text-align:center;}
.english-name{font-family:'Cinzel',serif;font-size:26px;font-weight:700;color:#fff;letter-spacing:2px;text-align:center;line-height:1.2;margin-bottom:10px;}

.role-badge{
  background:rgba(212,175,55,0.12);
  border:1px solid rgba(212,175,55,0.25);
  border-radius:20px;padding:6px 16px;
  font-size:10px;letter-spacing:2px;color:rgba(255,255,255,0.7);
  text-transform:uppercase;text-align:center;line-height:1.6;
}

.divider{
  height:1px;
  background:linear-gradient(to right,transparent,rgba(212,175,55,0.4),transparent);
  margin:24px 24px 0;position:relative;
}
.divider::before{content:'◆';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:7px;color:#D4AF37;background:#16213e;padding:0 8px;}

.info-section{padding:20px 24px;}
.info-row{
  display:flex;align-items:center;gap:14px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(212,175,55,0.1);
  border-radius:12px;padding:12px 16px;
  margin-bottom:10px;
  text-decoration:none;
  transition:all 0.3s;
}
.info-row:hover{background:rgba(212,175,55,0.08);border-color:rgba(212,175,55,0.3);transform:translateY(-2px);}
.info-icon{
  width:36px;height:36px;border-radius:10px;
  background:linear-gradient(135deg,rgba(212,175,55,0.25),rgba(212,175,55,0.05));
  border:1px solid rgba(212,175,55,0.2);
  display:flex;align-items:center;justify-content:center;
  font-size:16px;flex-shrink:0;
}
.info-label{font-size:9px;letter-spacing:2px;color:rgba(255,255,255,0.35);text-transform:uppercase;margin-bottom:3px;}
.info-value{font-size:13px;color:#fff;font-weight:500;line-height:1.5;}

.actions{padding:0 24px 28px;display:flex;flex-direction:column;gap:10px;}
.btn{
  display:flex;align-items:center;justify-content:center;gap:10px;
  padding:14px;border-radius:14px;
  font-size:13px;font-weight:700;letter-spacing:1.5px;
  text-decoration:none;text-transform:uppercase;
  transition:all 0.3s;cursor:pointer;
}
.btn-whatsapp{background:linear-gradient(135deg,#25D366,#128C7E);color:#fff;box-shadow:0 6px 20px rgba(37,211,102,0.35);}
.btn-whatsapp:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(37,211,102,0.5);}
.btn-email{background:rgba(255,255,255,0.06);border:1px solid rgba(212,175,55,0.25);color:#D4AF37;}
.btn-email:hover{background:rgba(212,175,55,0.1);transform:translateY(-2px);}
.btn-call{background:linear-gradient(135deg,#0f3460,#533483);color:#fff;border:1px solid rgba(212,175,55,0.2);box-shadow:0 6px 20px rgba(15,52,96,0.5);}
.btn-call:hover{transform:translateY(-2px);}

.bottom-bar{height:5px;background:linear-gradient(to right,#DA121A,#FCDD09,#078930);}

@keyframes float{0%{transform:translateY(0);opacity:0;}10%{opacity:1;}90%{opacity:0.3;}100%{transform:translateY(-600px);opacity:0;}}
.p{position:fixed;width:2px;height:2px;background:#D4AF37;border-radius:50%;animation:float var(--d) ease-in infinite var(--delay);bottom:0;left:var(--l);}
</style>
</head>
